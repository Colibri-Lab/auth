stages:
  - publish
  - playbook
  - build
  - deploy

publish:
  image: curlimages/curl:latest
  stage: publish
  variables:
    URL: "$CI_SERVER_PROTOCOL://$CI_SERVER_HOST:$CI_SERVER_PORT/api/v4/projects/$CI_PROJECT_ID/packages/composer?job_token=$CI_JOB_TOKEN"
  script:
    - version=$([[ -z "$CI_COMMIT_TAG" ]] && echo "branch=$CI_COMMIT_REF_NAME" || echo "tag=$CI_COMMIT_TAG")
    - insecure=$([ "$CI_SERVER_PROTOCOL" = "http" ] && echo "--insecure" || echo "")
    - response=$(curl -s -w "\n%{http_code}" $insecure --data $version $URL)
    - code=$(echo "$response" | tail -n 1)
    - body=$(echo "$response" | head -n 1) 
    # Output state information
    - if [ $code -eq 201 ]; then
        echo "Package created - Code $code - $body";
      else
        echo "Could not create package - Code $code - $body";
        exit 1;
      fi
  tags:
    - gitlab

.playbook-template:
  stage: playbook
  script:
    - rm -rf ./playbook || true
    - git clone https://gitlab.colibrilab.pro/colibrilab/recipes.git ./playbook
  artifacts:
    paths:
      - ./playbook/
    expire_in: 1 hour  

.build-template:
  stage: build
  script:

    - echo "Building ..."
    - ansible-playbook ./playbook/colibri-build.yml 
        -e mode="prod"
        -e folder="auth_dist"
        -e "repositories=[]"
        -e "modules=['colibri/security:dev-master','colibri/mainframe:dev-master','colibri/manage:dev-master','colibri/lang:dev-master','colibri/sites:dev-master','colibri/tools:dev-master','colibri/auth:dev-$CI_COMMIT_REF_NAME']"
        -e php=8.4
        -e composer=2

  artifacts:
    paths:
      - playbook/
      - auth_dist/
    expire_in: 1 hour

  only:
    - master

.deploy-template:
  stage: deploy
  script:

    - echo "Deploying ..."
    - ansible-playbook ./playbook/colibri-deploy.yml 
        -e host="$COLIBRI_PROD_DOMAIN"
        -e project_dir="/var/www/auth"
        -e folder="auth_dist"
        -e "php_scripts=[]"
        -e "bin_scripts=['migrate','auth-bundle.sh auth.colibrilab.pro','auth-bundle.sh backend.auth.colibrilab.pro','auth-publish.sh auth.colibrilab.pro','auth-queues.sh']"
        -e "queues=[]"
        -e php=8.3
  only:
    - master
  

playbook-public:
  extends: .playbook-template
  tags: 
    - gitlab

playbook-private:
  extends: .playbook-template
  tags: 
    - atg-gitlab

build-public:
  extends: .build-template
  needs:
    - job: publish
      artifacts: false
    - job: playbook-public
      artifacts: true
  tags: 
    - gitlab

build-private:
  extends: .build-template
  needs:
    - job: publish
      artifacts: false
    - job: playbook-private
      artifacts: true
  tags: 
    - atg-gitlab

deploy-public:
  extends: .deploy-template
  needs:
    - job: build-public
      artifacts: true
  tags: 
    - gitlab

deploy-private:
  extends: .deploy-template
  after_script:
  - |
    ssh gitlab-runner@10.10.10.8 "
      sudo sed -i 's/auth\.colibrilab\.pro/auth.atg.loc/g' /var/www/auth/config/hosts.yaml
      sudo sed -i 's/test\.colibrilab\.pro/atg.loc/g' /var/www/auth/config/auth.yaml
    "
  needs:
    - job: build-private
      artifacts: true  
  tags: 
    - atg-gitlab